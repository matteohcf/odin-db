# cargo-deny configuration (ADR-0017, ADR-0021).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices for transitive dependencies with no maintained replacement upstream.
# Not vulnerabilities; revisit when the parent crates move.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste: pulled in by specta/tauri" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: pulled in by the Linux GTK stack used by Tauri" },
  # Unmaintained notices, not vulnerabilities: merged into zbus 6, which secret-service
  # (keyring's Linux backend) has not adopted yet. Drop once keyring moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant: via keyring -> secret-service -> zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: via keyring -> secret-service -> zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: via keyring -> secret-service -> zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses compatible with distributing odin-db under MIT OR Apache-2.0.
# MPL-2.0 is file-level copyleft and is used, unmodified, by Tauri's HTML tooling.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
