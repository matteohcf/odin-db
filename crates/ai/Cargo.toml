[package]
name = "odin-ai"
description = "Natural-language query generation for odin-db with local models. Independent of Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Derives specta::Type on IPC-facing types; enabled by the desktop host only.
specta = ["dep:specta", "odin-core/specta"]

[dependencies]
bson.workspace = true
jiff.workspace = true
odin-core.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta = { workspace = true, optional = true }
sysinfo.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2.workspace = true

[lints]
workspace = true
