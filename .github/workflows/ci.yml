name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on fresh runners and cost disk space.
  CARGO_INCREMENTAL: 0
  LEFTHOOK: 0

jobs:
  # Which areas a change touches, so untouched ones skip their slow jobs. Fails open: when
  # the diff cannot be worked out, everything runs.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.areas.outputs.code }}
      rust: ${{ steps.areas.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! files=$(git diff --name-only "$BASE" HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$files"
          code=false
          rust=false
          if printf '%s\n' "$files" | grep -qvE '^(docs/|branding/|[^/]+\.md$|LICENSE)'; then code=true; fi
          if printf '%s\n' "$files" | grep -qE '^(crates/|apps/desktop/src-tauri/|Cargo\.|rust-toolchain\.toml|deny\.toml|clippy\.toml|\.github/)'; then rust=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  check:
    name: Lint, typecheck, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - name: Bindings are up to date
        run: |
          pnpm bindings
          git diff --exit-code packages/bindings

  integration:
    name: Integration (MongoDB ${{ matrix.mongo }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # MongoDB 8.0 refuses to start on Linux 6.19+ (SERVER-121912), the ubuntu-24.04 kernel.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongo: ["6.0", "7.0", "8.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Not shared with the ubuntu-24.04 jobs: their C objects need a newer glibc.
          key: ubuntu-22.04
      - name: Install MongoDB Database Tools (pinned, hash-verified)
        env:
          TOOLS_URL: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.19.1.tgz
          TOOLS_SHA256: f34b84a67ab96b4ff52571ec5d15e2148d96cb140b1ea9ef8c29ac33c48e3480
        run: |
          curl -fsSL "$TOOLS_URL" -o tools.tgz
          echo "$TOOLS_SHA256  tools.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tools" && tar -xzf tools.tgz -C "$RUNNER_TEMP/tools" --strip-components=1
          echo "ODIN_TOOLS_DIR=$RUNNER_TEMP/tools/bin" >> "$GITHUB_ENV"
      - name: Install mongosh (pinned, hash-verified)
        env:
          MONGOSH_URL: https://downloads.mongodb.com/compass/mongosh-2.13.0-linux-x64.tgz
          MONGOSH_SHA256: b2089e67641a28aa621476c4d62c69f66b9a41484baba24d8a8b1f5f96e92d0b
        run: |
          curl -fsSL "$MONGOSH_URL" -o mongosh.tgz
          echo "$MONGOSH_SHA256  mongosh.tgz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/mongosh" && tar -xzf mongosh.tgz -C "$RUNNER_TEMP/mongosh" --strip-components=1
          echo "ODIN_MONGOSH=$RUNNER_TEMP/mongosh/bin/mongosh" >> "$GITHUB_ENV"
      # Parallel tests pulling the same image at once break the pull on the runner.
      - name: Pull MongoDB image
        run: uname -r && docker pull mongo:${{ matrix.mongo }}
      - name: Core tests against a real MongoDB (testcontainers)
        run: cargo test -p odin-core --test mongo -- --ignored
        env:
          MONGO_VERSION: ${{ matrix.mongo }}

  deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  build:
    name: Build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported runner for glibc compatibility.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @odin-db/desktop tauri build --no-bundle

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The one status to require: green when every job passed or was skipped as untouched.
  ok:
    name: CI ok
    if: always()
    needs: [changes, check, integration, deny, build]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
