[package]
name = "odin-desktop"
description = "Tauri host for odin-db: thin commands over odin-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "odin-desktop"

[lib]
name = "odin_desktop_lib"
# Desktop only: staticlib/cdylib are for Tauri mobile targets, which odin-db does not ship.
crate-type = ["rlib"]

[[bin]]
name = "gen-bindings"
# Development tool: kept out of default builds so installers never ship it.
required-features = ["bindings"]

[features]
bindings = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
base64.workspace = true
odin-ai = { workspace = true, features = ["specta"] }
odin-core = { workspace = true, features = ["specta"] }
serde.workspace = true
# tauri::generate_context! embeds plugin configuration (the updater) as JSON values.
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
jiff.workspace = true
tokio.workspace = true
uuid.workspace = true

[lints]
workspace = true
