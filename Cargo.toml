[workspace]
resolver = "3"
members = ["crates/core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matteohcf/odin-db"
publish = false

[workspace.dependencies]
odin-core = { path = "crates/core" }

bson = { version = "3.1.0", features = ["serde", "serde_json-1"] }
csv = "1.4.0"
flate2 = "1.1.10"
jiff = "0.2.38"
keyring = "4.2.0"
portable-pty = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "aws-auth"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

# Release candidates are pinned exactly (ADR-0005).
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid", "serde_json"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

tauri = "2.12.4"
tauri-build = "2.7.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-window-state = "2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Line tables keep backtraces useful; full debug info for every dependency
# multiplies target/ size (it filled CI runners' disks).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
strip = true
